# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-GB"
tone_instructions: "Be direct, technical, and actionable. Cite exact lines.
  Prefer concrete guidance over vague suggestions. Use British English."
early_access: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: false
  code_guidelines:
    enabled: true

code_generation:
  docstrings:
    language: "en-GB"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Summarise the PR by server/client, MCP tools and resources, bundled skills, dependency locks, CI/packaging, deployment, n8n workflows, and documentation.
    Call out security impact, user-visible behaviour, API/schema/settings compatibility, skill provenance, packaging impact, and whether tests and documentation cover the change.
    Keep the summary terse and technical for maintainers of a BunkerWeb MCP integration.
  review_status: true
  review_details: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true
  # Fun features — keep CodeRabbit cheerful
  poem: true
  in_progress_fortune: true
  commit_status: true
  fail_commit_status: false
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 8
    base_branches:
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "[WIP]"
      - "RFC"
      - "DO NOT REVIEW"
    ignore_usernames:
      - "dependabot[bot]"
      - "TheophileDiot"
      - "fl0ppy-d1sk"

  slop_detection:
    enabled: true
    label: "needs-review"

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: |
        Use a short imperative subject describing one concern, consistent with repository history.
        Conventional Commits are welcome but not required. Put detail in the PR description.
    description:
      mode: "warning"
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"

  finishing_touches:
    # Auto-generated tests risk false confidence on a WAF; contributors write them.
    unit_tests:
      enabled: false

  path_filters:
    - "**"
    # Hash-pinned generated output; review the .in sources and lock checks instead.
    - "!requirements*.txt"
    # Local planning material, deliberately untracked.
    - "!docs/superpowers/**"

  path_instructions:
    - path: "src/bunkerweb_mcp/**"
      instructions: |
        Use Python >=3.11, explicit types compatible with mypy --strict, Ruff's 100-character formatting, and existing helpers and schemas.
        Keep the httpx client asynchronous, with bounded timeouts/retries and correct lifespan cleanup. Do not introduce blocking network calls in async handlers.
        Preserve Pydantic v2 validation and pydantic-settings defaults. Keep credentials as SecretStr and never expose secrets in logs, traces, errors, prompts, or responses.
        In main.py preserve authentication and token validation on /mcp/, /rpc and /ws, including the configured log-access boundary, DNS-rebinding protection and rate limits. Do not assume all transports share the same middleware.
        mcp_adapter.py uses the MCP Python SDK 2.x MCPServer API. Preserve tool signatures, validation, error translation, resource metadata and compatibility across HTTP, WebSocket and stdio callers.
        Keep tools/registry.py, parameter models, handlers and prompt data consistent when changing a tool contract. Reuse shared validation rather than bypassing it.
        For skill_catalog.py preserve deterministic URIs/order, byte digests, UTF-8 content, frontmatter validation, symlink rejection and file/byte limits. Resource reads must not execute skill content.
        The data/skills/ subtree is vendored: apply only the provenance instructions below to those files, never review their prose.

    - path: "src/bunkerweb_mcp/data/skills/**"
      instructions: |
        These are verbatim upstream files from bunkerity/bunkerweb-skills, pinned by the full commit in SKILLS_REF.
        Only review provenance: flag hand edits or drift from that pin; changes must come through scripts/sync_skills.py with its --ref argument. CI's --check verifies bytes against upstream.
        Do not suggest prose, style, formatting or content edits here. Make substantive skill changes upstream and sync them; do not ask for individual upstream files to be hand-edited in this repository.

    - path: "requirements*.in"
      instructions: |
        These exact pins are the source for generated, hash-pinned requirements*.txt locks. Never hand-edit the locks.
        Follow AGENTS.md's uv pip compile procedure: universal resolution, Python 3.11, generated hashes, and the runtime lock as the dev lock's constraint. Regenerate each affected lock, including Dependabot changes.
        Keep pyproject.toml dependency ranges compatible; only mcp has an exact SDK pin. Confirm lock tests cover supported Python versions and platform wheels.

    - path: "tests/**"
      instructions: |
        Test observable behaviour with deterministic fixtures and mocked BunkerWeb/network calls; avoid real services and arbitrary sleeps.
        Cover success, validation, authentication and upstream errors for changed handlers, plus cross-transport behaviour where applicable.
        Regression tests must fail before the fix. Preserve the 80% coverage floor and async test markers. Descriptive test names need no docstrings.

    - path: "scripts/**"
      instructions: |
        Keep scripts deterministic with explicit failure handling, bounded downloads, safe temporary paths and cleanup.
        sync_skills.py consumes untrusted tarballs: preserve traversal/link/type checks and member/file/total size limits, validation before writing, and rollback of both the tree and SKILLS_REF on failure.
        Do not modify the vendored tree with formatters. Shell scripts must match their declared interpreter, quote expansions, and avoid eval or piping remote content into a shell.

    - path: ".github/workflows/**"
      instructions: |
        Pin every external action to a full 40-hex commit SHA with a version comment. Third-party pip installs require hashes; the project's own install uses --no-deps.
        Every job needs explicit least-privilege permissions, including reusable workflow callers. Top-level permissions alone do not satisfy this repository's Plumber ISSUE-801 gate; preserve the A/100 target and root .plumber.yaml integration.
        Keep publish, registry login/push and security-report publication gated appropriately by event; distinguish run-scoped artefacts from external publication.
        Never execute untrusted PR code with secrets or interpolate event text directly into shell scripts. Preserve Python 3.11-3.14 checks, arm64 builds and vendored-skills drift checks.

    - path: "Dockerfile"
      instructions: |
        Preserve the digest-pinned Python 3.14 slim base, hashed third-party installs, --no-deps project wheel install and pip check before removing build tools.
        Keep packaged skill data available in the installed wheel. Avoid secrets in layers, unnecessary runtime packages and health checks requiring absent executables.

    - path: "docker-compose*.yml"
      instructions: |
        Keep service URLs, ports, environment variables, health checks and optional search modes consistent with settings and the image.
        Use placeholder credentials; preserve read-only log mounts and token requirements for log access. Prefer minimal mounts, capabilities and privileges where compatible.

    - path: "deploy/grafana/**"
      instructions: |
        Keep dashboard queries and datasource UIDs consistent with exported Prometheus metrics and provisioning files.
        Preserve valid importable JSON/YAML and useful labels, units and intervals. Do not embed credentials or expose sensitive log/configuration values through dashboards.

    - path: "n8n-workflows/**"
      instructions: |
        Keep workflow JSON importable and tool names, parameters, RPC payloads, authentication headers and response handling aligned with the server registry and transport contracts.
        Use n8n credential references and obvious placeholders rather than real tokens, endpoints or account identifiers. Update import-order and configuration documentation when workflow dependencies change.

    - path: "docs/**"
      instructions: |
        Use concise British English and verify paths, settings, transport examples and deployment prerequisites against the code.
        Update documentation for changes to defaults, authentication, APIs, packaging and observability; record architectural changes in docs/adr/.
        Do not review local planning material under docs/superpowers/ or duplicate upstream skill prose reviews.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 120000
    languagetool:
      enabled: true
      level: "default"
      # GITHUB fires on every `.github/` path inside code spans
      disabled_rules:
        - "GITHUB"
    gitleaks:
      enabled: true
    luacheck:
      enabled: false
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    checkov:
      enabled: true
    osvScanner:
      enabled: true
    # No HTML templates or Lua sources in this Python integration.
    htmlhint:
      enabled: false
    dotenvLint:
      enabled: true
    flake8:
      enabled: false
    ruff:
      enabled: false
    eslint:
      enabled: false
    stylelint:
      enabled: false
    semgrep:
      enabled: false
    biome:
      enabled: false

chat:
  auto_reply: true
